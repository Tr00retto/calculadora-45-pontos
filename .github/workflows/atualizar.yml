name: Atualizar classificação e publicar
on:
  schedule:
    - cron: '17,47 0-4,17-23 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - panorama.js
      - panorama.css
      - comparador-periodos.js
      - comparador-periodos.css
      - viradas-reacoes.js
      - viradas-reacoes.css
      - relogio-gols.js
      - relogio-gols.css
      - relogio-gols.json
      - mando.json
      - mudancas.json
      - classificacao.json
      - termometro.html
      - projetor.html
      - forma.json
      - raio-x.html
      - raio-x.css
      - raio-x.js
      - raio-x.json
      - scripts/**
      - .github/workflows/atualizar.yml
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: atualizar-e-publicar
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar comparação por rodada
        run: |
          python -m unittest discover -s tests -v
          node --check relogio-gols.js
          node tests/test_goal_clock.js
          node --check viradas-reacoes.js
          node tests/test_reactions.js
          node --check comparador-periodos.js
          node tests/test_periods.js
      - name: Consultar classificação pública
        run: python scripts/update-standings.py
      - name: Consultar forma do Brasileirão
        run: python scripts/update-form.py
      - name: Consultar campanha por mando
        run: python scripts/update-mando.py
      - name: Consultar minutos dos gols
        run: python scripts/update-goal-clock.py
      - name: Consultar calendário e força dos adversários
        run: python scripts/update-raiox.py
      - name: Registrar comparação da rodada
        run: python scripts/update-day.py
      - name: Salvar classificação e forma validadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relogio-gols.json mando.json classificacao.json forma.json raio-x.json mudancas.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza classificação pela fonte pública"
            git push
          fi
      - uses: actions/configure-pages@v5
      - name: Preparar site público
        run: |
          mkdir -p public
          cp comparador-periodos.js comparador-periodos.css viradas-reacoes.js viradas-reacoes.css relogio-gols.js relogio-gols.css relogio-gols.json mando.json panorama.js panorama.css mudancas.json index.html classificacao.json projetor.html termometro.html forma.json raio-x.html raio-x.css raio-x.js raio-x.json public/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4


