name: Atualizar classificação e publicar
on:
  schedule:
    - cron: '17,47 0-4,17-23 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - classificacao.json
      - scripts/**
      - .github/workflows/atualizar.yml
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: atualizar-e-publicar
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar classificação pública
        run: python scripts/update-standings.py
      - name: Salvar classificação validada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add classificacao.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza classificação pela fonte pública"
            git push
          fi
      - uses: actions/configure-pages@v5
      - name: Preparar site público
        run: |
          mkdir -p public
          cp index.html classificacao.json public/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
